
name: Python Bot Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'python_bot/python_bot.py'
  workflow_dispatch:
    inputs:
      version:
        description: "Version, example v0.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          SOURCE_VERSION=$(python -c "import pathlib,re; s=pathlib.Path('python_bot/python_bot.py').read_text(); print(re.search(r\"(?m)^VERSION\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]\",s).group(1))")
          VERSION="${REQUESTED_VERSION:-v$SOURCE_VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate source and version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -f python_bot/python_bot.py
          test -f python_bot/START_PYTHON_BOT.pyw
          python - <<'PY'
          import os, re, pathlib
          expected = os.environ["VERSION"].removeprefix("v")
          source = pathlib.Path("python_bot/python_bot.py").read_text(encoding="utf-8")
          found = re.search(r"(?m)^VERSION\s*=\s*['\"]([^'\"]+)['\"]", source)
          if not found or found.group(1) != expected:
              raise SystemExit(f"Version mismatch: requested {expected}, source {found.group(1) if found else 'missing'}")
          print(f"Verified source version: {expected}")
          PY
          python -m py_compile python_bot/python_bot.py python_bot/update_manager.py python_bot/apply_update.py python_bot/discord_listener.py

      - name: Package Python Bot
        run: |
          files=()
          for name in python_bot.py update_manager.py apply_update.py START_PYTHON_BOT.pyw START_PYTHON_BOT.vbs START_PYTHON_BOT.bat discord_listener.py README_VI.txt RELEASE_GUIDE.txt README_DISCORD.txt README_UPDATE.txt; do
            if [ -f "python_bot/$name" ]; then
              files+=("python_bot/$name")
            fi
          done
          zip "Python_Bot_${VERSION}.zip" "${files[@]}"
          sha256sum "Python_Bot_${VERSION}.zip" \
            > "Python_Bot_${VERSION}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "Python_Bot_${VERSION}.zip" \
              "Python_Bot_${VERSION}.zip.sha256" --clobber
            gh release edit "$VERSION" --latest
          else
            gh release create "$VERSION" \
              "Python_Bot_${VERSION}.zip" \
              "Python_Bot_${VERSION}.zip.sha256" \
              --title "Python Bot $VERSION" \
              --notes "Python Bot update $VERSION" \
              --latest
          fi
