
name: Python Bot Auto Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, example v0.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate source and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -f python_bot/python_bot.py
          test -f python_bot/START_PYTHON_BOT.pyw
          python - <<'PY'
          import os, re, pathlib
          expected = os.environ["VERSION"].removeprefix("v")
          source = pathlib.Path("python_bot/python_bot.py").read_text(encoding="utf-8")
          found = re.search(r"(?m)^VERSION\s*=\s*['\"]([^'\"]+)['\"]", source)
          if not found or found.group(1) != expected:
              raise SystemExit(f"Version mismatch: requested {expected}, source {found.group(1) if found else 'missing'}")
          print(f"Verified source version: {expected}")
          PY

      - name: Package Python Bot
        env:
          VERSION: ${{ inputs.version }}
        run: |
          zip -r "Python_Bot_${VERSION}.zip" python_bot \
            -x "*/__pycache__/*" "*.pyc"
          sha256sum "Python_Bot_${VERSION}.zip" \
            > "Python_Bot_${VERSION}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            "Python_Bot_${VERSION}.zip" \
            "Python_Bot_${VERSION}.zip.sha256" \
            --title "Python Bot $VERSION" \
            --notes "Python Bot update $VERSION" \
            --latest
